<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elyon do Brasil — Importação</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0D0D;
  --s1:#141414;
  --s2:#1C1C1C;
  --s3:#252525;
  --s4:#2E2E2E;
  --bd:rgba(255,255,255,0.09);
  --y:#FFE500;
  --yd:#D4BF00;
  --white:#FFFFFF;
  --w80:rgba(255,255,255,0.80);
  --w50:rgba(255,255,255,0.50);
  --w30:rgba(255,255,255,0.30);
  --w12:rgba(255,255,255,0.12);
  --w06:rgba(255,255,255,0.06);
  --bp:#5BA3FF;
  --bt:#FF8C3A;
  --ba:#FF5572;
  --bv:#3ECF7A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px}

/* ── HEADER ── */
header{
  height:54px;background:var(--s1);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;
  padding:0 24px;position:sticky;top:0;z-index:100;
}
header img{height:32px;object-fit:contain;flex-shrink:0}
.h-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:var(--white)}
.h-sep{width:1px;height:18px;background:var(--bd);margin:0 6px}
.h-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--w30);font-weight:300}
.h-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.saved-pill{
  font-size:11px;color:var(--bv);background:rgba(62,207,122,.1);
  border:1px solid rgba(62,207,122,.25);padding:3px 10px;border-radius:4px;
  display:none;letter-spacing:.06em;font-weight:500;
}
.hbtn{
  padding:7px 14px;border-radius:6px;border:1px solid var(--bd);
  background:transparent;color:var(--w80);font-size:12px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--w30);color:var(--white)}
.hbtn.y{background:var(--y);border-color:var(--y);color:#000;font-weight:700}
.hbtn.y:hover{background:var(--yd);border-color:var(--yd)}

/* ── PIPELINE ── */
.pipeline{
  background:var(--s1);border-bottom:1px solid var(--bd);
  padding:0 24px;display:flex;align-items:stretch;gap:0;overflow-x:auto;
}
.pipe-step{
  display:flex;align-items:center;gap:8px;
  padding:12px 20px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .15s;
  position:relative;
}
.pipe-step:hover{background:var(--w06)}
.pipe-step.active{border-bottom-color:var(--y)}
.pipe-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pipe-label{font-size:12px;font-weight:500;color:var(--w50);letter-spacing:.04em;transition:color .15s}
.pipe-step.active .pipe-label{color:var(--white)}
.pipe-count{
  font-size:11px;font-weight:600;
  background:var(--s3);padding:2px 7px;border-radius:3px;color:var(--w50);
}
.pipe-step.active .pipe-count{background:rgba(255,229,0,.15);color:var(--y)}
.pipe-arr{color:var(--w12);font-size:18px;line-height:1;display:flex;align-items:center;padding:0 2px;flex-shrink:0}

/* ── METRICS ── */
.metrics{
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:16px 24px;gap:10px;border-bottom:1px solid var(--bd);
}
.metric{
  background:var(--s2);border:1px solid var(--bd);
  border-radius:8px;padding:13px 15px;
  border-top:2px solid var(--mc,var(--bd));
  transition:transform .15s;
}
.metric:hover{transform:translateY(-1px)}
.m-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w30);font-weight:500;margin-bottom:6px}
.m-val{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.02em;color:var(--white);line-height:1}
.m-sub{font-size:10px;color:var(--w30);margin-top:3px}

/* ── TOOLBAR ── */
.toolbar{
  padding:13px 24px;display:flex;gap:10px;align-items:center;
  border-bottom:1px solid var(--bd);background:var(--s1);
}
.srch{
  flex:1;min-width:180px;position:relative;
}
.srch input{
  width:100%;background:var(--s2);border:1px solid var(--bd);
  border-radius:6px;padding:8px 12px 8px 36px;
  font-size:13px;color:var(--white);outline:none;
  font-family:'DM Sans',sans-serif;transition:border-color .15s;
}
.srch input:focus{border-color:var(--w30)}
.srch input::placeholder{color:var(--w30)}
.srch::before{
  content:'⌕';position:absolute;left:11px;top:50%;
  transform:translateY(-50%);color:var(--w30);font-size:16px;pointer-events:none;
}

/* ── GRID ── */
.main{padding:20px 24px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* ── CARD ── */
.card{
  background:var(--s1);border:1px solid var(--bd);
  border-radius:10px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;
  transition:border-color .2s,transform .15s,box-shadow .2s;
}
.card:hover{border-color:rgba(255,255,255,0.2);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.c-thumb{width:100%;height:105px;object-fit:cover;display:block;border-bottom:1px solid var(--bd)}
.c-thumb-ph{
  width:100%;height:70px;background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  color:var(--w30);font-size:12px;font-weight:500;
  border-bottom:1px solid var(--bd);letter-spacing:.06em;gap:6px;
}
.c-body{padding:12px 13px;flex:1;display:flex;flex-direction:column;gap:8px}
.c-head{display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
.badge{
  font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:3px;white-space:nowrap;
  flex-shrink:0;
}
.b-pedido{background:rgba(91,163,255,.15);color:#8CC4FF;border:1px solid rgba(91,163,255,.3)}
.b-transito{background:rgba(255,140,58,.15);color:#FFB07A;border:1px solid rgba(255,140,58,.3)}
.b-alfandega{background:rgba(255,85,114,.15);color:#FF8FA3;border:1px solid rgba(255,85,114,.3)}
.b-chegou{background:rgba(62,207,122,.15);color:#7EEDB0;border:1px solid rgba(62,207,122,.3)}
.c-id{
  font-family:'Bebas Neue',sans-serif;font-size:16px;
  letter-spacing:.06em;color:var(--white);white-space:nowrap;
}
.c-forn{font-size:11px;color:var(--w30);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;flex-shrink:0}
.c-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.meta-i{display:flex;flex-direction:column;gap:1px}
.meta-l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--w30);font-weight:500}
.meta-v{font-size:12px;color:var(--w80);font-weight:400}
.late-tag{font-size:9px;color:#FF8FA3;font-weight:600;letter-spacing:.06em}
.c-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;border-top:1px solid var(--bd);margin-top:auto;
}
.c-skus{font-size:11px;color:var(--w30);font-weight:500}
.prog{background:var(--s3);border-radius:2px;height:3px;flex:1;margin-left:10px;overflow:hidden}
.pf{height:100%;border-radius:2px}
.pf-pedido{background:var(--bp);width:15%}
.pf-transito{background:var(--bt);width:55%}
.pf-alfandega{background:var(--ba);width:80%}
.pf-chegou{background:var(--bv);width:100%}

/* ── EMPTY ── */
.empty{
  grid-column:1/-1;text-align:center;padding:72px 20px;color:var(--w30);
}
.empty-ic{font-size:48px;opacity:.25;margin-bottom:14px}
.empty-tx{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.14em;color:var(--w30)}

/* ── OVERLAYS ── */
.ov{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:200;align-items:flex-start;justify-content:center;
  padding:24px 16px;overflow-y:auto;
}
.ov.open{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--bd);
  border-radius:12px;padding:24px;width:100%;max-width:560px;
  box-shadow:0 40px 100px rgba(0,0,0,.8);
  animation:up .2s ease both;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.m-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.m-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:var(--white)}
.xbtn{
  padding:5px 9px;border-radius:5px;border:1px solid var(--bd);
  background:transparent;color:var(--w50);cursor:pointer;font-size:14px;
  transition:all .15s;line-height:1;
}
.xbtn:hover{border-color:var(--w50);color:var(--white)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w30);font-weight:500}
.fld input,.fld textarea,.fld select{
  background:var(--s2);border:1px solid var(--bd);
  border-radius:6px;padding:9px 12px;
  font-size:13px;color:var(--white);outline:none;
  font-family:'DM Sans',sans-serif;transition:border-color .15s;width:100%;
}
.fld input:focus,.fld textarea:focus{border-color:var(--w50)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--w30)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--y);opacity:.6;font-weight:500;
  margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;
}
.st-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sopt{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 13px;border-radius:4px;border:1px solid var(--bd);
  cursor:pointer;background:transparent;color:var(--w50);transition:all .15s;
}
.s-pedido.sel{border-color:var(--bp);color:#8CC4FF;background:rgba(91,163,255,.12)}
.s-transito.sel{border-color:var(--bt);color:#FFB07A;background:rgba(255,140,58,.12)}
.s-alfandega.sel{border-color:var(--ba);color:#FF8FA3;background:rgba(255,85,114,.12)}
.s-chegou.sel{border-color:var(--bv);color:#7EEDB0;background:rgba(62,207,122,.12)}
.img-drop{
  border:1px dashed var(--bd);border-radius:7px;
  padding:18px;text-align:center;cursor:pointer;
  background:var(--s2);transition:border-color .2s;position:relative;overflow:hidden;
}
.img-drop:hover{border-color:var(--w30)}
.img-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-drop-lbl{font-size:11px;color:var(--w30);margin-top:5px}
.img-prev{width:100%;height:85px;object-fit:cover;border-radius:5px;margin-top:8px;display:none}
.sku-hdr{display:grid;grid-template-columns:1fr 1.2fr 60px 75px 75px 28px;gap:6px;margin-bottom:4px}
.sku-hdr span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--w30);font-weight:500}
.sku-lst{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.sku-row{display:grid;grid-template-columns:1fr 1.2fr 60px 75px 75px 28px;gap:6px;align-items:center}
.sku-row input{font-size:12px;padding:7px 9px}
.del{background:transparent;border:none;color:var(--w30);cursor:pointer;font-size:14px;transition:color .15s;display:flex;align-items:center;justify-content:center;padding:0}
.del:hover{color:var(--ba)}
.add-sku{
  width:100%;padding:8px;border-radius:5px;
  border:1px dashed var(--bd);background:transparent;
  color:var(--w30);font-size:12px;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .2s;font-weight:500;
}
.add-sku:hover{border-color:var(--w50);color:var(--white)}
.m-actions{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);
}
.btn-s{
  padding:9px 22px;border-radius:6px;border:none;
  background:var(--y);color:#000;font-size:13px;font-weight:700;
  font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;font-size:15px;
  cursor:pointer;transition:all .15s;
}
.btn-s:hover{background:var(--yd);transform:translateY(-1px)}
.btn-c{
  padding:9px 16px;border-radius:6px;border:1px solid var(--bd);
  background:transparent;color:var(--w50);font-size:13px;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.btn-c:hover{border-color:var(--w30);color:var(--white)}

/* detail */
.d-img{width:100%;height:140px;object-fit:cover;border-radius:7px;margin-bottom:14px}
.d-ph{width:100%;height:55px;background:var(--s2);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--w30);font-size:12px;gap:6px;margin-bottom:14px;font-weight:500}
.d-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}
.d-row:last-child{border-bottom:none}
.d-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--w30);font-weight:500}
.d-v{color:var(--white);font-weight:500;text-align:right;max-width:65%}
.sku-tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;margin-top:6px}
.sku-tbl th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--w30);font-weight:500;padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd)}
.sku-tbl td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--w80);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sku-tbl tr:last-child td{border-bottom:none}
.sku-tot{display:flex;justify-content:space-between;padding:8px 6px 0;font-size:13px;font-weight:700;border-top:1px solid var(--bd);margin-top:4px;color:var(--white)}
.s-change{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;margin-bottom:2px}

/* storage indicator */
.store-bar{
  background:var(--s2);border-bottom:1px solid var(--bd);
  padding:6px 24px;display:flex;align-items:center;gap:10px;
  font-size:10px;letter-spacing:.08em;color:var(--w30);font-weight:500;
}
.store-dot{width:6px;height:6px;border-radius:50%;background:var(--bv);flex-shrink:0;box-shadow:0 0 6px var(--bv)}
.store-info{color:var(--w30)}
.store-size{margin-left:auto;color:var(--w30)}
.backup-btn{
  padding:3px 10px;border-radius:4px;border:1px solid var(--bd);
  background:transparent;color:var(--w50);font-size:10px;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .15s;letter-spacing:.06em;
}
.backup-btn:hover{border-color:var(--y);color:var(--y)}

@media(max-width:600px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  header,.toolbar,.pipeline,.main,.metrics,.store-bar{padding-left:14px;padding-right:14px}
  .grid{grid-template-columns:1fr}
  .r2{grid-template-columns:1fr}
}
</style>
</head>

    <div class="fld"><label>Valor Total (US$)</label><input id="f-valor" type="number" min="0" step="0.01" placeholder="0.00" oninput="calcBRL()"></div>
  </div>
  <div class="r2">
    <div class="fld"><label>Câmbio (R$ por US$)</label><input id="f-cambio" type="number" min="0" step="0.01" placeholder="ex: 5.85" oninput="calcBRL()"></div>
    <div class="fld"><label>Valor Total (R$) — calculado</label><input id="f-brl" type="text" placeholder="—" readonly style="background:var(--s3);color:var(--bv);font-weight:600;cursor:default"></div>
  </div>
  <div class="fld">
    <label>Status</label>
    <div class="st-btns" id="stOpts">
      <button class="sopt s-pedido sel" onclick="setSt('pedido',this)">Pedido</button>
      <button class="sopt s-transito" onclick="setSt('transito',this)">Em Trânsito</button>
      <button class="sopt s-alfandega" onclick="setSt('alfandega',this)">Alfândega</button>
      <button class="sopt s-chegou" onclick="setSt('chegou',this)">Chegou</button>
    </div>
  </div>
  <div class="fld"><label>Observações</label><textarea id="f-obs" rows="2" placeholder="ex: docs na Receita, aguardando pagamento, urgente..."></textarea></div>
  <div class="sec">Foto / Invoice</div>
  <div class="img-drop" onclick="document.getElementById('f-img').click()">
    <input type="file" id="f-img" accept="image/*" onchange="prevImg(this)">
    <div style="font-size:24px;color:var(--w30)">📷</div>
    <div class="img-drop-lbl">Clique para adicionar foto ou imagem da invoice</div>
    <img id="imgPrev" class="img-prev">
  </div>
  <div class="sec">
    Produtos / SKUs
    <button class="hbtn" style="font-size:11px;padding:4px 10px" onclick="addSkuRow()">+ item</button>
  </div>
  <div class="sku-hdr" style="grid-template-columns:1fr 1.2fr 60px 75px 75px 28px">
    <span>SKU</span><span>Descrição</span><span>Qtd</span><span>Unit US$</span><span>Unit R$</span><span></span>
  </div>
  <div class="sku-lst" id="skuLst"></div>
  <button class="add-sku" onclick="addSkuRow()">+ adicionar produto</button>
  <div class="m-actions">
    <button class="btn-c" onclick="closeAdd()">cancelar</button>
    <button class="btn-s" id="saveBtn" onclick="saveC()">SALVAR</button>
  </div>
</div>
</div>

<!-- DETAIL MODAL -->
<div class="ov" id="detOv">
<div class="modal">
  <div class="m-hd">
    <span class="m-title" id="detTitle">Detalhes</span>
    <div style="display:flex;gap:6px">
      <button class="xbtn" onclick="editFromDet()" title="Editar">✏</button>
      <button class="xbtn" onclick="closeDet()">✕</button>
    </div>
  </div>
  <div id="detBody"></div>
  <div class="m-actions">
    <button class="btn-c" onclick="delC()" style="border-color:rgba(255,85,114,.3);color:#FF8FA3">🗑 excluir</button>
    <button class="btn-s" onclick="closeDet()">FECHAR</button>
  </div>
</div>
</div>

<script>
const KEY='elyon_v3';
const SL={pedido:'Pedido',transito:'Em Trânsito',alfandega:'Alfândega',chegou:'Chegou'};
const SC={pedido:'b-pedido',transito:'b-transito',alfandega:'b-alfandega',chegou:'b-chegou'};
const PC={pedido:'pf-pedido',transito:'pf-transito',alfandega:'pf-alfandega',chegou:'pf-chegou'};

let D=[],filt='todos',cSt='pedido',dIdx=null,eIdx=null,imgD=null;

/* ── STORAGE ── */
function save(notify=true){
  try{
    const json=JSON.stringify(D);
    localStorage.setItem(KEY,json);
    localStorage.setItem(KEY+'_ts',new Date().toISOString());
    updateStoreInfo();
    if(notify){
      const p=document.getElementById('savedPill');
      p.style.display='inline-flex';
      setTimeout(()=>p.style.display='none',2500);
    }
  }catch(e){alert('Erro ao salvar: armazenamento cheio? Use o botão Backup JSON.');}
}

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){D=JSON.parse(r);return;}
  }catch(e){}
  D=[
    {id:'CTN-2025-01',forn:'Guangzhou Parts Co.',pedido:'2025-01-10',prev:'2025-03-20',invoice:'INV-20250110',valor:18500,status:'chegou',obs:'Chegou completo. Etiquetas prontas.',img:null,skus:[
      {sku:'MP-1021',desc:'Pastilha freio dianteira',qtd:200,unit:4.50},
      {sku:'MP-1022',desc:'Cabo de embreagem CG125',qtd:150,unit:3.20},
      {sku:'MP-1030',desc:'Rolamento roda traseira',qtd:80,unit:8.90},
    ]},
    {id:'CTN-2025-02',forn:'Shenzhen Motors Ltd.',pedido:'2025-02-05',prev:'2025-04-15',invoice:'INV-20250205',valor:22300,status:'alfandega',obs:'Documentação na Receita. Aguardar despacho.',img:null,skus:[
      {sku:'SM-0045',desc:'Pistão motor 150cc',qtd:100,unit:22.00},
      {sku:'SM-0046',desc:'Anel de pistão std',qtd:400,unit:1.80},
    ]},
    {id:'CTN-2025-03',forn:'Guangzhou Parts Co.',pedido:'2025-03-01',prev:'2025-05-10',invoice:'INV-20250301',valor:15700,status:'transito',obs:'Saiu de Xangai 10/03. ETA 45 dias.',img:null,skus:[
      {sku:'MP-2010',desc:'Corrente transmissão 520',qtd:120,unit:12.50},
      {sku:'MP-2011',desc:'Pinhão dianteiro Z14',qtd:120,unit:5.00},
    ]},
    {id:'CTN-2025-04',forn:'Hangzhou Moto Supply',pedido:'2025-04-01',prev:'2025-06-05',invoice:'INV-20250401',valor:9800,status:'pedido',obs:'Aguardando confirmação.',img:null,skus:[
      {sku:'HM-3301',desc:'Espelho retrovisor par',qtd:60,unit:7.00},
    ]},
  ];
  save(false);
}

function updateStoreInfo(){
  try{
    const json=localStorage.getItem(KEY)||'';
    const kb=(json.length/1024).toFixed(1);
    const ts=localStorage.getItem(KEY+'_ts');
    const info=ts?'Salvo em '+new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Armazenamento ativo';
    document.getElementById('storeInfo').textContent=info;
    document.getElementById('storeSize').textContent=kb+' KB usados';
  }catch(e){}
}

function exportBackup(){
  const blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),data:D},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='elyon_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const obj=JSON.parse(e.target.result);
      const arr=obj.data||obj;
      if(!Array.isArray(arr))throw new Error('Formato inválido');
      if(!confirm('Isso substituirá todos os dados atuais. Continuar?'))return;
      D=arr;save();render();
      alert('Backup restaurado com sucesso! '+D.length+' containers carregados.');
    }catch(err){alert('Erro ao importar: '+err.message);}
  };
  r.readAsText(f);
  input.value='';
}

function exportCSV(){
  const h=['Nº Container','Fornecedor','Invoice','Data Pedido','Previsão','Valor US$','Câmbio','Valor R$','Status','SKUs','Unidades','Observações'];
  const rows=D.map(c=>{
    const u=(c.skus||[]).reduce((a,s)=>a+(+s.qtd||0),0);
    return[c.id,c.forn,c.invoice,c.pedido,c.prev,c.valor,c.cambio||'',c.valorBRL||'',SL[c.status],(c.skus||[]).length,u,c.obs].map(v=>`"${String(v||'').replace(/"/g,'""')}"`);
  });
  const sh=['','Nº Container','SKU','Descrição','Qtd','Unit US$','Unit R$','Total US$'];
  const sr=[];
  D.forEach(c=>(c.skus||[]).forEach(s=>sr.push(['',c.id,s.sku,s.desc,s.qtd,s.unit,s.unitBRL||'',(s.qtd*s.unit).toFixed(2)].map(v=>`"${String(v||'').replace(/"/g,'""')}"`  ))));
  const csv=[h,...rows,[''],sh,...sr].map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='elyon_containers.csv';a.click();
}

/* ── RENDER ── */
function calcTot(s){return(s||[]).reduce((a,r)=>a+((+r.qtd||0)*(+r.unit||0)),0)}
function fmt(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function isLate(p,s){if(s==='chegou')return false;if(!p)return false;return new Date(p)<new Date()}

function renderMetrics(){
  const cnt={todos:D.length,pedido:0,transito:0,alfandega:0,chegou:0};
  let usd=0,units=0;
  let brl=0;
  D.forEach(c=>{cnt[c.status]++;usd+=+c.valor||0;brl+=+c.valorBRL||0;units+=(c.skus||[]).reduce((a,s)=>a+(+s.qtd||0),0)});
  ['todos','pedido','transito','alfandega','chegou'].forEach(k=>{
    const el=document.getElementById('c-'+k);if(el)el.textContent=cnt[k];
  });
  const defs=[
    {l:'Containers',v:D.length,c:'#FFE500',sub:'total'},
    {l:'Em Trânsito',v:cnt.transito,c:'#FF8C3A',sub:'containers'},
    {l:'Alfândega',v:cnt.alfandega,c:'#FF5572',sub:'containers'},
    {l:'Chegaram',v:cnt.chegou,c:'#3ECF7A',sub:'containers'},
    {l:'Total US$',v:'US$ '+usd.toLocaleString('pt-BR',{minimumFractionDigits:2}),c:'#FFE500',sub:units.toLocaleString('pt-BR')+' unidades',small:true},
    {l:'Total R$',v:brl>0?'R$ '+brl.toLocaleString('pt-BR',{minimumFractionDigits:2}):'—',c:'#3ECF7A',sub:'câmbio médio ponderado',small:true},
  ];
  document.getElementById('metricsBar').innerHTML=defs.map(d=>`
    <div class="metric" style="--mc:${d.c}">
      <div class="m-lbl">${d.l}</div>
      <div class="m-val" style="${d.small?'font-size:20px;margin-top:4px':''}${d.small?';color:'+d.c:''}">${d.v}</div>
      <div class="m-sub">${d.sub}</div>
    </div>`).join('');
}

function render(){
  const q=document.getElementById('srchInput').value.toLowerCase();
  const grid=document.getElementById('cardsGrid');
  const list=D.filter(c=>{
    const mf=filt==='todos'||c.status===filt;
    const ms=!q||c.id.toLowerCase().includes(q)||c.forn.toLowerCase().includes(q)||(c.invoice||'').toLowerCase().includes(q)||(c.skus||[]).some(s=>s.sku.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q));
    return mf&&ms;
  });
  renderMetrics();
  if(!list.length){
    grid.innerHTML=`<div class="empty"><div class="empty-ic">📦</div><div class="empty-tx">Nenhum container encontrado</div></div>`;
    return;
  }
  grid.innerHTML=list.map(c=>{
    const idx=D.indexOf(c);
    const sq=(c.skus||[]).length;
    const su=(c.skus||[]).reduce((a,s)=>a+(+s.qtd||0),0);
    const late=isLate(c.prev,c.status);
    const img=c.img?`<img class="c-thumb" src="${c.img}" alt="">`:`<div class="c-thumb-ph">📦 sem imagem</div>`;
    return`<div class="card" onclick="openDet(${idx})">
      ${img}
      <div class="c-body">
        <div class="c-head">
          <span class="badge ${SC[c.status]}">${SL[c.status]}</span>
          <span class="c-id">${c.id}</span>
          <span class="c-forn">${c.forn}</span>
        </div>
        <div class="c-meta">
          <div class="meta-i"><span class="meta-l">Invoice</span><span class="meta-v">${c.invoice||'—'}</span></div>
          <div class="meta-i"><span class="meta-l">Pedido</span><span class="meta-v">${fmt(c.pedido)}</span></div>
          <div class="meta-i"><span class="meta-l">Previsão</span><span class="meta-v">${fmt(c.prev)}${late?' <span class="late-tag">⚠ atrasado</span>':''}</span></div>
          <div class="meta-i"><span class="meta-l">Valor US$</span><span class="meta-v">US$ ${(+c.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>
          <div class="meta-i"><span class="meta-l">Valor R$</span><span class="meta-v" style="${c.valorBRL>0?'color:#3ECF7A':''}">${c.valorBRL>0?'R$ '+c.valorBRL.toLocaleString('pt-BR',{minimumFractionDigits:2}):'—'}</span></div>
        </div>
        <div class="c-foot">
          <span class="c-skus">📦 ${sq} SKUs · ${su.toLocaleString('pt-BR')} unid.</span>
          <div class="prog"><div class="pf ${PC[c.status]}"></div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setF(f,btn){
  filt=f;
  document.querySelectorAll('.pipe-step').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
  render();
}

/* ── ADD / EDIT ── */
function openAdd(){
  eIdx=null;imgD=null;
  document.getElementById('formTitle').textContent='Novo Container';
  document.getElementById('saveBtn').textContent='SALVAR';
  ['f-id','f-forn','f-pedido','f-prev','f-invoice','f-obs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-valor').value='';
  document.getElementById('f-cambio').value='';
  document.getElementById('f-brl').value='';
  document.getElementById('imgPrev').style.display='none';
  cSt='pedido';
  document.querySelectorAll('#stOpts .sopt').forEach(b=>{b.classList.remove('sel');if(b.classList.contains('s-pedido'))b.classList.add('sel');});
  document.getElementById('skuLst').innerHTML='';addSkuRow();
  document.getElementById('addOv').classList.add('open');
}
function calcBRL(){
  const usd=parseFloat(document.getElementById('f-valor').value)||0;
  const cambio=parseFloat(document.getElementById('f-cambio').value)||0;
  const brl=document.getElementById('f-brl');
  if(usd>0&&cambio>0){
    brl.value='R$ '+( usd*cambio ).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    // recalcula skus
    document.querySelectorAll('#skuLst .sku-row').forEach(row=>{
      const inp=row.querySelectorAll('input');
      const u=parseFloat(inp[3].value)||0;
      if(u>0) inp[4].value=(u*cambio).toFixed(2);
    });
  } else brl.value='—';
}
function closeAdd(){document.getElementById('addOv').classList.remove('open')}

function setSt(s,btn){cSt=s;document.querySelectorAll('#stOpts .sopt').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}

function prevImg(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{imgD=e.target.result;const p=document.getElementById('imgPrev');p.src=imgD;p.style.display='block';};
  r.readAsDataURL(f);
}

function addSkuRow(sku){
  const lst=document.getElementById('skuLst');
  const d=document.createElement('div');d.className='sku-row';
  const unitBRL = sku&&sku.unitBRL ? sku.unitBRL : '';
  d.innerHTML=`<input type="text" placeholder="SKU" value="${sku?sku.sku:''}">
    <input type="text" placeholder="descrição" value="${sku?sku.desc:''}">
    <input type="number" placeholder="0" min="0" value="${sku?sku.qtd:''}" oninput="recalcSkuBRL(this)">
    <input type="number" placeholder="0.00" min="0" step="0.01" value="${sku?sku.unit:''}" oninput="recalcSkuBRL(this)">
    <input type="number" placeholder="R$" min="0" step="0.01" value="${unitBRL}" style="background:var(--s3);color:var(--bv)" title="Valor unitário em R$">
    <button class="del" onclick="this.parentElement.remove()">✕</button>`;
  lst.appendChild(d);
}
function recalcSkuBRL(el){
  const row=el.closest('.sku-row');
  const inputs=row.querySelectorAll('input');
  const usd=parseFloat(inputs[3].value)||0;
  const cambio=parseFloat(document.getElementById('f-cambio').value)||0;
  if(cambio>0) inputs[4].value=(usd*cambio).toFixed(2);
}

function getSkus(){
  return Array.from(document.querySelectorAll('#skuLst .sku-row')).map(row=>{
    const inp=row.querySelectorAll('input');
    return{sku:inp[0].value.trim(),desc:inp[1].value.trim(),qtd:parseFloat(inp[2].value)||0,unit:parseFloat(inp[3].value)||0,unitBRL:parseFloat(inp[4].value)||0};
  }).filter(s=>s.sku||s.desc);
}

function saveC(){
  const id=document.getElementById('f-id').value.trim();
  const forn=document.getElementById('f-forn').value.trim();
  if(!id||!forn){alert('Informe o nº do container e o fornecedor.');return;}
  const cambio=parseFloat(document.getElementById('f-cambio').value)||0;
  const valorUSD=parseFloat(document.getElementById('f-valor').value)||0;
  const obj={
    id,forn,
    pedido:document.getElementById('f-pedido').value,
    prev:document.getElementById('f-prev').value,
    invoice:document.getElementById('f-invoice').value.trim(),
    valor:valorUSD,
    cambio:cambio,
    valorBRL:cambio>0?(valorUSD*cambio):0,
    status:cSt,
    obs:document.getElementById('f-obs').value.trim(),
    img:imgD!==null?imgD:(eIdx!==null?D[eIdx].img:null),
    skus:getSkus(),
  };
  if(eIdx!==null)D[eIdx]=obj;else D.unshift(obj);
  save();closeAdd();render();
}

/* ── DETAIL ── */
function openDet(idx){
  dIdx=idx;const c=D[idx];
  document.getElementById('detTitle').textContent=c.id;
  const sr=(c.skus||[]).map(s=>`<tr>
    <td title="${s.sku}">${s.sku}</td>
    <td title="${s.desc}">${s.desc}</td>
    <td style="text-align:right">${(+s.qtd).toLocaleString('pt-BR')}</td>
    <td style="text-align:right">US$ ${(+s.unit).toFixed(2)}</td>
    <td style="text-align:right">US$ ${(s.qtd*s.unit).toFixed(2)}</td>
    <td style="text-align:right;color:#3ECF7A">${s.unitBRL>0?'R$ '+(+s.unitBRL).toFixed(2):'—'}</td>
  </tr>`).join('');
  const tot=calcTot(c.skus);
  const su=(c.skus||[]).reduce((a,s)=>a+(+s.qtd||0),0);
  const iH=c.img?`<img class="d-img" src="${c.img}" alt="">`:`<div class="d-ph">📦 sem imagem</div>`;
  const sB=['pedido','transito','alfandega','chegou'].map(s=>`<button class="sopt s-${s}${c.status===s?' sel':''}" onclick="chgSt('${s}',this)">${SL[s]}</button>`).join('');
  const late=isLate(c.prev,c.status);
  document.getElementById('detBody').innerHTML=`
    ${iH}
    ${[['Fornecedor',c.forn],['Invoice',c.invoice||'—'],['Data do Pedido',fmt(c.pedido)],['Previsão',fmt(c.prev)+(late?' ⚠ atrasado':'')],['Valor Total US$','US$ '+(+c.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2})],['Câmbio','R$ '+(+c.cambio||0).toFixed(2)+' / US$'],['Valor Total R$',c.valorBRL>0?'<span style="color:#3ECF7A;font-weight:700">R$ '+c.valorBRL.toLocaleString('pt-BR',{minimumFractionDigits:2})+'</span>':'—'],['Observações',c.obs||'—']].map(r=>`<div class="d-row"><span class="d-k">${r[0]}</span><span class="d-v">${r[1]}</span></div>`).join('')}
    <div style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--w30);margin:14px 0 6px;font-weight:500">Alterar status:</div>
    <div class="s-change">${sB}</div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--white);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center">
      Produtos
      <span style="font-weight:400;color:var(--w30);font-size:10px;text-transform:none">${(c.skus||[]).length} SKUs · ${su.toLocaleString('pt-BR')} unid.</span>
    </div>
    ${(c.skus||[]).length?`<div style="overflow-x:auto"><table class="sku-tbl">
      <thead><tr><th style="width:14%">SKU</th><th>Descrição</th><th style="width:9%;text-align:right">Qtd</th><th style="width:12%;text-align:right">US$</th><th style="width:12%;text-align:right">Total US$</th><th style="width:13%;text-align:right;color:#3ECF7A">R$ unit</th></tr></thead>
      <tbody>${sr}</tbody>
    </table>
    <div class="sku-tot"><span>Total US$</span><span>US$ ${tot.toFixed(2)}</span></div>
    ${c.valorBRL>0?`<div class="sku-tot" style="border-top:none;padding-top:4px"><span style="color:#3ECF7A">Total R$</span><span style="color:#3ECF7A">R$ ${c.valorBRL.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>`:''}
    </div>`
    :`<div style="font-size:12px;color:var(--w30);padding:8px 0">Nenhum produto cadastrado.</div>`}`;
  document.getElementById('detOv').classList.add('open');
}

function chgSt(s,btn){
  if(dIdx===null)return;
  D[dIdx].status=s;save();
  document.querySelectorAll('#detBody .sopt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');render();
}
function closeDet(){document.getElementById('detOv').classList.remove('open');dIdx=null}

function editFromDet(){
  const idx=dIdx;closeDet();const c=D[idx];eIdx=idx;imgD=null;
  document.getElementById('formTitle').textContent='Editar '+c.id;
  document.getElementById('saveBtn').textContent='ATUALIZAR';
  document.getElementById('f-id').value=c.id;
  document.getElementById('f-forn').value=c.forn;
  document.getElementById('f-pedido').value=c.pedido||'';
  document.getElementById('f-prev').value=c.prev||'';
  document.getElementById('f-invoice').value=c.invoice||'';
  document.getElementById('f-valor').value=c.valor||'';
  document.getElementById('f-cambio').value=c.cambio||'';

  const p=document.getElementById('imgPrev');
  if(c.img){p.src=c.img;p.style.display='block';}else p.style.display='none';
  document.getElementById('skuLst').innerHTML='';
  (c.skus||[]).forEach(s=>addSkuRow(s));
  if(!(c.skus||[]).length)addSkuRow();
  document.getElementById('addOv').classList.add('open');
}

  D.splice(dIdx,1);save();closeDet();render();
}
